<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title description">
<title id="title">한 사람의 지원에서 다음 온보딩으로</title>
<desc id="description">지금의 막힘: 개발 DB 연결을 함께 확인; 남긴 결과: 붙여넣어 시작하는 설정 가이드; 다음 확인: 다른 사용자의 단독 실행 여부. 가이드 작성 완료 · 다음 사용자 검증은 남음</desc>
