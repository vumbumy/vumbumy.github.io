<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title description">
<title id="title">통계 조회를 운영계에서 분리하는 방향</title>
<desc id="description">출처와 상태값: 지표별 원본 데이터 확인; 통계 DB 경유: 운영계를 직접 읽는 부하 피하기; 연동 전 확인: 정의·귀속·접근 권한 확정 필요. 검토한 조회 방향 · 전체 연동 완료는 아님</desc>
