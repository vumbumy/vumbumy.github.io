<desc id="description">전체 메트릭: 모든 실행 환경의 총 소비량; 사용자 로그: 환경 누락·표본·보존기간 확인; 운영 판단: 집계·추천과 실제 변경을 분리. 운영 지표의 기준 정리 · 성과나 실제 결제액과 구분</desc>
