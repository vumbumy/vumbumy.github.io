<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title description">
<title id="title">읽기 경로와 지표 정의를 함께 정하기</title>
<desc id="description">업무 시스템: 상담·계약의 운영 경로 보호; 통계 저장소: 지표 정의와 갱신 책임 합의 필요; 대시보드: 운영계를 직접 조회하지 않는 방향. 데이터 제공 방향 · 접근 권한과 실제 연동은 미확정</desc>
