<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title description">
<title id="title">해결책을 고르기 전에 적을 것</title>
<desc id="description">영향 범위: 누가, 어떤 시스템이 영향을 받나; 결정 책임: 내가 정할 것과 다른 팀이 정할 것; 확인 기준: 검증 방법과 되돌아갈 지점. 블로그에서 문제를 기록하는 관점</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cfd9de"/></pattern></defs>
<rect width="760" height="700" rx="24" fill="#f4f7f8"/>
<rect width="760" height="700" rx="24" fill="url(#dots)" opacity=".45"/>
<g font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Arial,sans-serif">
<rect x="40" y="40" width="5" height="26" rx="2" fill="#267c82"/>
<text x="58" y="60" font-size="18" fill="#426b70" font-weight="700">본문 한눈에 보기</text>
<text x="40" y="110" font-size="30" fill="#24384a" font-weight="700">해결책을 고르기 전에 적을 것</text>
<rect x="40" y="148" width="680" height="118" rx="16" fill="#fff" stroke="#d6e0e4"/>
<rect x="62" y="175" width="48" height="48" rx="15" fill="#e5f1f0"/>
<text x="73" y="207" font-size="23" fill="#216f75" font-weight="700">01</text>
<text x="132" y="194" font-size="29" fill="#24384a" font-weight="700">영향 범위</text>
<text x="132" y="233" font-size="23" fill="#536874" font-weight="400">누가, 어떤 시스템이 영향을 받나</text>
<rect x="40" y="293" width="680" height="118" rx="16" fill="#fff" stroke="#d6e0e4"/>
<rect x="62" y="320" width="48" height="48" rx="15" fill="#e5f1f0"/>
<text x="73" y="352" font-size="23" fill="#216f75" font-weight="700">02</text>
<text x="132" y="339" font-size="29" fill="#24384a" font-weight="700">결정 책임</text>
<text x="132" y="378" font-size="23" fill="#536874" font-weight="400">내가 정할 것과 다른 팀이 정할 것</text>
<rect x="40" y="438" width="680" height="118" rx="16" fill="#fff" stroke="#d6e0e4"/>
<rect x="62" y="465" width="48" height="48" rx="15" fill="#e5f1f0"/>
<text x="73" y="497" font-size="23" fill="#216f75" font-weight="700">03</text>
<text x="132" y="484" font-size="29" fill="#24384a" font-weight="700">확인 기준</text>
<text x="132" y="523" font-size="23" fill="#536874" font-weight="400">검증 방법과 되돌아갈 지점</text>
<path d="M40 598h680" stroke="#d1dce1"/>
<text x="40" y="634" font-size="19" fill="#536874" font-weight="400">블로그에서 문제를 기록하는 관점</text>
<text x="40" y="672" font-size="13" fill="#6b8089" font-weight="600">HANBEOM  /  WORK NOTES</text>
</g></svg>
