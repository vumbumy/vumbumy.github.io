<text x="132" y="233" font-size="23" fill="#536874" font-weight="400">시트 자동화인가, 접속형 화면인가</text>
<path d="M380 266v18m-6-6 6 6 6-6" fill="none" stroke="#93a9b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
